<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Control de Acceso — Barra Libre Palermo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#f0ece0;font-family:'DM Sans',sans-serif;min-height:100vh}
.login-screen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.login-box{background:#111;border:1px solid #2a2a2a;border-radius:16px;padding:36px 28px;width:100%;max-width:320px;text-align:center}
.login-title{font-family:'Bebas Neue',sans-serif;font-size:26px;color:#c8893a;letter-spacing:2px;margin-bottom:6px}
.login-sub{font-size:12px;color:#555;margin-bottom:24px}
.login-input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;color:#f0ece0;font-family:'DM Sans',sans-serif;font-size:15px;padding:12px 14px;border-radius:8px;outline:none;margin-bottom:12px;text-align:center;letter-spacing:2px}
.login-input:focus{border-color:#c8893a}
.login-btn{width:100%;background:#c8893a;color:#0a0a0a;border:none;border-radius:8px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;padding:13px;cursor:pointer}
.login-error{color:#E24B4A;font-size:12px;margin-top:10px;display:none}
.app{display:none}
.topbar{background:#111;border-bottom:1px solid #222;padding:14px 20px;text-align:center;position:sticky;top:0;z-index:10}
.topbar-title{font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;color:#c8893a}
.topbar-sub{font-size:11px;color:#555;margin-top:1px}
.topbar-right{position:absolute;right:16px;top:50%;transform:translateY(-50%)}
.sync-btn{background:#1a1a1a;border:1px solid #2a2a2a;color:#888;font-family:'DM Sans',sans-serif;font-size:11px;padding:5px 10px;border-radius:6px;cursor:pointer}
.sync-ok{color:#5DCAA5 !important;border-color:#5DCAA544 !important}
.container{max-width:420px;margin:0 auto;padding:20px 16px 60px}
.counter-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.counter-card{background:#111;border:1px solid #1e1e1e;border-radius:10px;padding:12px 8px;text-align:center}
.counter-num{font-family:'Bebas Neue',sans-serif;font-size:26px;line-height:1}
.counter-label{font-size:10px;color:#555;margin-top:2px;letter-spacing:1px;text-transform:uppercase}
.cnt-green{color:#5DCAA5}.cnt-gold{color:#c8893a}.cnt-red{color:#E24B4A}
.cam-box{background:#111;border:1px solid #2a2a2a;border-radius:14px;overflow:hidden;margin-bottom:16px}
.cam-header{padding:12px 16px;display:flex;justify-content:space-between;align-items:center}
.cam-label{font-size:12px;color:#666}
.cam-btn{background:#c8893a;border:none;color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:8px 16px;border-radius:7px;cursor:pointer}
.cam-btn.stop{background:#1e0a0a;color:#E24B4A;border:1px solid #E24B4A44}
.video-wrap{position:relative;width:100%;display:none}
.video-wrap.active{display:block}
video{width:100%;display:block;max-height:300px;object-fit:cover}
.scan-line{position:absolute;top:0;left:0;right:0;height:3px;background:#c8893a;opacity:0.8;animation:scanAnim 2s linear infinite}
@keyframes scanAnim{0%{top:0}100%{top:100%}}
.corner{position:absolute;width:24px;height:24px;border-color:#c8893a;border-style:solid;opacity:0.9}
.corner.tl{top:12px;left:12px;border-width:3px 0 0 3px}
.corner.tr{top:12px;right:12px;border-width:3px 3px 0 0}
.corner.bl{bottom:12px;left:12px;border-width:0 0 3px 3px}
.corner.br{bottom:12px;right:12px;border-width:0 3px 3px 0}
.manual-box{padding:12px 16px;border-top:1px solid #1a1a1a}
.manual-label{font-size:11px;color:#555;margin-bottom:8px;text-align:center}
.scan-input-row{display:flex;gap:8px}
.qr-input{flex:1;background:#1a1a1a;border:1px solid #2a2a2a;color:#f0ece0;font-family:'DM Sans',sans-serif;font-size:14px;padding:11px 14px;border-radius:8px;outline:none}
.qr-input:focus{border-color:#c8893a}
.qr-input::placeholder{color:#444}
.scan-btn{background:#c8893a;border:none;color:#0a0a0a;font-family:'Bebas Neue',sans-serif;font-size:14px;letter-spacing:1px;padding:11px 14px;border-radius:8px;cursor:pointer}
.result-box{border-radius:14px;padding:24px 20px;text-align:center;display:none;margin-bottom:16px}
.result-box.valid{background:#0a1e14;border:2px solid #5DCAA5;display:block}
.result-box.invalid{background:#1e0a0a;border:2px solid #E24B4A;display:block}
.result-box.used{background:#1a1508;border:2px solid #c8893a;display:block}
.result-icon-wrap{width:56px;height:56px;border-radius:50%;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.valid .result-icon-wrap{background:#0f2e20}.invalid .result-icon-wrap{background:#2e1010}.used .result-icon-wrap{background:#2a2010}
.result-title{font-family:'Bebas Neue',sans-serif;font-size:32px;letter-spacing:2px;margin-bottom:4px}
.valid .result-title{color:#5DCAA5}.invalid .result-title{color:#E24B4A}.used .result-title{color:#c8893a}
.result-name{font-size:16px;font-weight:500;color:#f0ece0;margin-bottom:4px}
.result-detail{font-size:13px;color:#888}
.history-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.history-label{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444}
.clear-btn{font-size:11px;color:#555;background:none;border:none;cursor:pointer;font-family:'DM Sans',sans-serif}
.history-item{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#111;border:1px solid #1e1e1e;border-radius:8px;margin-bottom:8px}
.hi-name{font-size:13px;color:#f0ece0}.hi-time{font-size:11px;color:#555;margin-top:2px}
.hi-badge{font-size:10px;padding:3px 10px;border-radius:20px;font-weight:500}
.hi-ok{background:#0a1e14;color:#5DCAA5}.hi-used{background:#1a1508;color:#c8893a}.hi-no{background:#1e0a0a;color:#E24B4A}
.empty-hist{font-size:13px;color:#333;text-align:center;padding:16px 0}
.guests-count{font-size:11px;color:#555;text-align:center;margin-bottom:12px}
.guests-count span{color:#c8893a;font-weight:500}
</style>
</head>
<body>

<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">Control de Acceso</div>
    <div class="login-sub">Barra Libre Palermo · 11 Abr</div>
    <input type="password" class="login-input" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter')doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta.</div>
  </div>
</div>

<div class="app" id="appScreen">
  <div class="topbar" style="position:relative">
    <div class="topbar-title">Control de Acceso</div>
    <div class="topbar-sub">Barra Libre Palermo · 11 Abr</div>
    <div class="topbar-right">
      <button class="sync-btn" id="syncBtn" onclick="syncGuests()">↻ Sincronizar</button>
    </div>
  </div>
  <div class="container">
    <div class="counter-row">
      <div class="counter-card"><div class="counter-num cnt-green" id="cntOk">0</div><div class="counter-label">Ingresaron</div></div>
      <div class="counter-card"><div class="counter-num cnt-gold" id="cntUsed">0</div><div class="counter-label">Ya usados</div></div>
      <div class="counter-card"><div class="counter-num cnt-red" id="cntInvalid">0</div><div class="counter-label">Inválidos</div></div>
    </div>

    <div class="guests-count" id="guestsCount">Cargando lista de invitados...</div>

    <div class="cam-box">
      <div class="cam-header">
        <div class="cam-label">Escáner de cámara</div>
        <button class="cam-btn" id="camBtn" onclick="toggleCamera()">Abrir cámara</button>
      </div>
      <div class="video-wrap" id="videoWrap">
        <video id="video" playsinline autoplay muted></video>
        <div class="scan-line"></div>
        <div class="corner tl"></div><div class="corner tr"></div>
        <div class="corner bl"></div><div class="corner br"></div>
      </div>
      <div class="manual-box">
        <div class="manual-label">O pegá el código manualmente</div>
        <div class="scan-input-row">
          <input class="qr-input" id="qrInput" placeholder="Código QR..." onkeydown="if(event.key==='Enter')scanManual()">
          <button class="scan-btn" onclick="scanManual()">Validar</button>
        </div>
      </div>
    </div>

    <div class="result-box" id="resultBox">
      <div class="result-icon-wrap" id="resultIcon"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-name" id="resultName"></div>
      <div class="result-detail" id="resultDetail"></div>
    </div>

    <div class="history-header">
      <div class="history-label">Últimos escaneos</div>
      <button class="clear-btn" onclick="clearHistory()">Limpiar</button>
    </div>
    <div id="historyList"></div>
  </div>
</div>

<canvas id="canvas" style="display:none"></canvas>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbyqawYio7MOmRfLjGhYj-1SfNLcv8QmfPnZjSO5f0fCx0dxKKbLgOqjBEjWZG0DTNZBUQ/exec';
  const SCANNER_PASSWORD = 'fiesta2025';

  let scannedIds = new Set();
  let history = [];
  let counts = { ok: 0, used: 0, invalid: 0 };
  let approvedGuests = [];
  let stream = null, scanning = false, lastScan = 0;

  function doLogin() {
    if (document.getElementById('passInput').value === SCANNER_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      syncGuests();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  async function syncGuests() {
    const btn = document.getElementById('syncBtn');
    btn.textContent = 'Cargando...';
    try {
      const res = await fetch(API_URL + '?action=getAll');
      const data = await res.json();
      approvedGuests = (data.guests || []).filter(g => g.status === 'aprobado');
      document.getElementById('guestsCount').innerHTML =
        'Lista cargada: <span>' + approvedGuests.length + ' aprobados</span>';
      btn.textContent = '✓ Listo';
      btn.className = 'sync-btn sync-ok';
      setTimeout(() => { btn.textContent = '↻ Sincronizar'; btn.className = 'sync-btn'; }, 3000);
    } catch (e) {
      document.getElementById('guestsCount').textContent = 'Error al cargar. Tocá Sincronizar.';
      btn.textContent = '↻ Sincronizar';
    }
  }

  async function toggleCamera() {
    if (stream) { stopCamera(); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: { ideal: 'environment' } }, audio: false
      });
      const video = document.getElementById('video');
      video.srcObject = stream;
      document.getElementById('videoWrap').classList.add('active');
      document.getElementById('camBtn').textContent = 'Cerrar cámara';
      document.getElementById('camBtn').classList.add('stop');
      scanning = true;
      requestAnimationFrame(scanFrame);
    } catch (e) {
      alert('No se pudo acceder a la cámara. Verificá los permisos en la configuración del navegador.');
    }
  }

  function stopCamera() {
    scanning = false;
    if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
    document.getElementById('videoWrap').classList.remove('active');
    document.getElementById('camBtn').textContent = 'Abrir cámara';
    document.getElementById('camBtn').classList.remove('stop');
  }

  function scanFrame() {
    if (!scanning) return;
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    if (video.readyState === video.HAVE_ENOUGH_DATA) {
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
      const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      const code = jsQR(imageData.data, imageData.width, imageData.height, { inversionAttempts: 'dontInvert' });
      if (code) {
        const now = Date.now();
        if (now - lastScan > 3000) { lastScan = now; processQR(code.data); }
      }
    }
    requestAnimationFrame(scanFrame);
  }

  function scanManual() {
    const raw = document.getElementById('qrInput').value.trim();
    if (!raw) return;
    document.getElementById('qrInput').value = '';
    processQR(raw);
  }

  function processQR(raw) {
    const now = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    let guest = null;
    try {
      const parsed = JSON.parse(raw);
      if (parsed && parsed.id && parsed.event === 'BLP-20250411') {
        guest = approvedGuests.find(g => String(g.id) === String(parsed.id)) || null;
      }
    } catch (e) {}

    const box = document.getElementById('resultBox');
    if (!guest) {
      box.className = 'result-box invalid';
      document.getElementById('resultIcon').textContent = '✕';
      document.getElementById('resultTitle').textContent = 'No válido';
      document.getElementById('resultName').textContent = 'QR desconocido';
      document.getElementById('resultDetail').textContent = 'Este código no está en la lista de aprobados';
      counts.invalid++; addHistory('Desconocido', 'no', now);
    } else if (scannedIds.has(String(guest.id))) {
      box.className = 'result-box used';
      document.getElementById('resultIcon').textContent = '!';
      document.getElementById('resultTitle').textContent = 'Ya ingresó';
      document.getElementById('resultName').textContent = guest.name;
      document.getElementById('resultDetail').textContent = 'DNI ' + guest.dni + ' · QR ya usado';
      counts.used++; addHistory(guest.name, 'used', now);
    } else {
      scannedIds.add(String(guest.id));
      box.className = 'result-box valid';
      document.getElementById('resultIcon').textContent = '✓';
      document.getElementById('resultTitle').textContent = '¡Puede ingresar!';
      document.getElementById('resultName').textContent = guest.name;
      document.getElementById('resultDetail').textContent = 'DNI ' + guest.dni;
      counts.ok++; addHistory(guest.name, 'ok', now);
    }
    updateCounters();
    if (navigator.vibrate) navigator.vibrate([200]);
  }

  function addHistory(name, status, time) {
    history.unshift({ name, status, time });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function renderHistory() {
    const list = document.getElementById('historyList');
    if (history.length === 0) { list.innerHTML = '<div class="empty-hist">Sin escaneos aún</div>'; return; }
    list.innerHTML = history.map(h => `
      <div class="history-item">
        <div><div class="hi-name">${h.name}</div><div class="hi-time">${h.time}</div></div>
        <span class="hi-badge ${h.status === 'ok' ? 'hi-ok' : h.status === 'used' ? 'hi-used' : 'hi-no'}">
          ${h.status === 'ok' ? 'Ingresó' : h.status === 'used' ? 'Ya usado' : 'Rechazado'}
        </span>
      </div>`).join('');
  }

  function updateCounters() {
    document.getElementById('cntOk').textContent = counts.ok;
    document.getElementById('cntUsed').textContent = counts.used;
    document.getElementById('cntInvalid').textContent = counts.invalid;
  }

  function clearHistory() {
    history = []; counts = { ok: 0, used: 0, invalid: 0 };
    updateCounters(); renderHistory();
    document.getElementById('resultBox').style.display = 'none';
  }

  renderHistory();
</script>
</body>
</html>
