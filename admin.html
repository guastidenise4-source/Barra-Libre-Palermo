<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Barra Libre Palermo</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'DM Sans', sans-serif; background: #0a0a0a; color: #f0ece0; min-height: 100vh; }

  /* LOGIN */
  .login-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 24px;
  }
  .login-box {
    background: #111; border: 1px solid #2a2a2a; border-radius: 16px;
    padding: 36px 28px; width: 100%; max-width: 340px; text-align: center;
  }
  .login-title { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #c8893a; letter-spacing: 2px; margin-bottom: 6px; }
  .login-sub { font-size: 12px; color: #555; margin-bottom: 24px; }
  .login-input {
    width: 100%; background: #1a1a1a; border: 1px solid #2a2a2a; color: #f0ece0;
    font-family: 'DM Sans', sans-serif; font-size: 15px; padding: 12px 14px;
    border-radius: 8px; outline: none; margin-bottom: 12px; text-align: center; letter-spacing: 2px;
  }
  .login-input:focus { border-color: #c8893a; }
  .login-btn {
    width: 100%; background: #c8893a; color: #0a0a0a; border: none; border-radius: 8px;
    font-family: 'Bebas Neue', sans-serif; font-size: 18px; letter-spacing: 2px;
    padding: 13px; cursor: pointer;
  }
  .login-error { color: #E24B4A; font-size: 12px; margin-top: 10px; display: none; }

  /* APP */
  .app { display: none; }
  .topbar {
    background: #111; border-bottom: 1px solid #222;
    padding: 14px 20px; display: flex; align-items: center; justify-content: space-between;
    position: sticky; top: 0; z-index: 10;
  }
  .topbar-title { font-family: 'Bebas Neue', sans-serif; font-size: 22px; letter-spacing: 2px; color: #c8893a; }
  .topbar-sub { font-size: 11px; color: #555; margin-top: 1px; }
  .topbar-right { display: flex; align-items: center; gap: 10px; }
  .badge-count { background: #c8893a; color: #0a0a0a; border-radius: 20px; font-size: 11px; font-weight: 500; padding: 3px 10px; }
  .refresh-btn {
    background: #1a1a1a; border: 1px solid #2a2a2a; color: #888;
    font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 12px;
    border-radius: 7px; cursor: pointer;
  }
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #1a1a1a; border-bottom: 1px solid #222; }
  .stat { background: #0e0e0e; padding: 16px 20px; text-align: center; }
  .stat-num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: #f0ece0; line-height: 1; }
  .stat-label { font-size: 11px; color: #555; margin-top: 3px; letter-spacing: 1px; text-transform: uppercase; }
  .stat-num.gold { color: #c8893a; }
  .stat-num.green { color: #5DCAA5; }
  .filters { display: flex; gap: 8px; padding: 14px 16px; border-bottom: 1px solid #1a1a1a; overflow-x: auto; }
  .filter-btn {
    border: 1px solid #2a2a2a; background: transparent; color: #888;
    font-family: 'DM Sans', sans-serif; font-size: 12px; padding: 6px 14px;
    border-radius: 20px; cursor: pointer; white-space: nowrap; transition: all 0.15s;
  }
  .filter-btn.active { background: #c8893a; border-color: #c8893a; color: #0a0a0a; font-weight: 500; }
  .guest-list { padding: 12px 14px 40px; }
  .guest-card {
    background: #111; border: 1px solid #1e1e1e; border-radius: 10px;
    padding: 14px 16px; margin-bottom: 10px;
  }
  .guest-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  .guest-name { font-weight: 500; font-size: 15px; color: #f0ece0; }
  .guest-meta { font-size: 12px; color: #555; margin-top: 3px; }
  .status-badge {
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    padding: 3px 10px; border-radius: 20px; flex-shrink: 0; font-weight: 500;
  }
  .status-pendiente { background: #2a2010; color: #c8893a; border: 1px solid #c8893a44; }
  .status-aprobado { background: #0a1e18; color: #5DCAA5; border: 1px solid #5DCAA544; }
  .status-rechazado { background: #1e0a0a; color: #E24B4A; border: 1px solid #E24B4A44; }
  .guest-email { font-size: 12px; color: #666; margin-top: 8px; }
  .guest-tanda { font-size: 11px; color: #c8893a; margin-top: 4px; }
  .guest-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn-approve {
    flex: 1; background: #0a1e18; border: 1px solid #5DCAA544; color: #5DCAA5;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    padding: 9px; border-radius: 7px; cursor: pointer; transition: background 0.15s;
  }
  .btn-approve:hover { background: #0f2e24; }
  .btn-reject {
    flex: 1; background: #1e0a0a; border: 1px solid #E24B4A44; color: #E24B4A;
    font-family: 'DM Sans', sans-serif; font-size: 13px; font-weight: 500;
    padding: 9px; border-radius: 7px; cursor: pointer;
  }
  .btn-qr {
    background: #1a1510; border: 1px solid #c8893a44; color: #c8893a;
    font-family: 'DM Sans', sans-serif; font-size: 12px; font-weight: 500;
    padding: 9px 14px; border-radius: 7px; cursor: pointer;
  }
  .btn-loading { opacity: 0.5; pointer-events: none; }
  .empty-state { text-align: center; padding: 60px 20px; color: #444; font-size: 14px; }
  .loading-state { text-align: center; padding: 60px 20px; color: #555; font-size: 14px; }

  /* QR MODAL */
  .modal-bg {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.88); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-bg.open { display: flex; }
  .qr-modal {
    background: #111; border: 1px solid #2a2a2a; border-radius: 16px;
    padding: 32px 28px; text-align: center; max-width: 300px; width: 100%;
  }
  .qr-event { font-size: 11px; color: #c8893a; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }
  .qr-name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; color: #f0ece0; letter-spacing: 1px; }
  .qr-dni { font-size: 13px; color: #888; margin-top: 4px; margin-bottom: 16px; }
  #qrCanvas { background: #f0ece0; padding: 10px; border-radius: 8px; }
  .qr-close {
    margin-top: 18px; background: transparent; border: 1px solid #2a2a2a; color: #888;
    font-family: 'DM Sans', sans-serif; padding: 9px 28px; border-radius: 7px;
    cursor: pointer; font-size: 13px;
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <div class="login-title">Panel Admin</div>
    <div class="login-sub">Barra Libre Palermo · 11 Abr</div>
    <input type="password" class="login-input" id="passInput" placeholder="Contraseña" onkeydown="if(event.key==='Enter') doLogin()">
    <button class="login-btn" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="loginError">Contraseña incorrecta.</div>
  </div>
</div>

<!-- APP -->
<div class="app" id="appScreen">
  <div class="topbar">
    <div>
      <div class="topbar-title">Panel Admin</div>
      <div class="topbar-sub">Barra Libre Palermo · 11 Abr</div>
    </div>
    <div class="topbar-right">
      <span class="badge-count" id="pendingBadge">0 pendientes</span>
      <button class="refresh-btn" onclick="loadGuests()">↻ Actualizar</button>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat"><div class="stat-num gold" id="statPending">0</div><div class="stat-label">Pendientes</div></div>
    <div class="stat"><div class="stat-num green" id="statApproved">0</div><div class="stat-label">Aprobados</div></div>
    <div class="stat"><div class="stat-num" id="statTotal">0</div><div class="stat-label">Total</div></div>
  </div>

  <div class="filters">
    <button class="filter-btn active" onclick="setFilter('all', this)">Todos</button>
    <button class="filter-btn" onclick="setFilter('pendiente', this)">Pendientes</button>
    <button class="filter-btn" onclick="setFilter('aprobado', this)">Aprobados</button>
    <button class="filter-btn" onclick="setFilter('rechazado', this)">Rechazados</button>
  </div>

  <div class="guest-list" id="guestList">
    <div class="loading-state">Cargando invitados...</div>
  </div>
</div>

<iframe name="hidden_iframe" style="display:none;"></iframe>

<!-- QR MODAL -->
<div class="modal-bg" id="qrModal">
  <div class="qr-modal">
    <div class="qr-event">Barra Libre Palermo · 11 Abr</div>
    <div class="qr-name" id="modalName"></div>
    <div class="qr-dni" id="modalDni"></div>
    <div id="qrCanvas"></div>
    <br>
    <button class="qr-close" onclick="closeModal()">Cerrar</button>
  </div>
</div>

<script>
  // ============================================================
  // PEGÁ ACÁ LA URL DE TU APPS SCRIPT (Paso 3 del tutorial)
  const API_URL = 'https://script.google.com/macros/s/AKfycbyqawYio7MOmRfLjGhYj-1SfNLcv8QmfPnZjSO5f0fCx0dxKKbLgOqjBEjWZG0DTNZBUQ/exec';

  // CONTRASEÑA DEL PANEL ADMIN — cambiala por la tuya
  const ADMIN_PASSWORD = 'fiesta2025';
  // ============================================================

  let guests = [];
  let currentFilter = 'all';
  let qrInstance = null;

  function doLogin() {
    const pass = document.getElementById('passInput').value;
    if (pass === ADMIN_PASSWORD) {
      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appScreen').style.display = 'block';
      loadGuests();
    } else {
      document.getElementById('loginError').style.display = 'block';
    }
  }

  function callScript(params) {
    return new Promise((resolve) => {
      const form = document.createElement('form');
      form.method = 'GET';
      form.action = API_URL;
      form.target = 'hidden_iframe';
      for (const key in params) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = key;
        input.value = params[key];
        form.appendChild(input);
      }
      document.body.appendChild(form);
      form.submit();
      setTimeout(() => { document.body.removeChild(form); resolve(); }, 3000);
    });
  }

  async function loadGuests() {
    document.getElementById('guestList').innerHTML = '<div class="loading-state">Cargando...</div>';
    try {
      const res = await fetch(API_URL + '?action=getAll');
      const data = await res.json();
      guests = data.guests || [];
    } catch (e) {
      guests = [];
      document.getElementById('guestList').innerHTML = '<div class="empty-state">Error al cargar. Verificá la URL del script.</div>';
      return;
    }
    render();
  }

  async function approve(id) {
    const card = document.getElementById('card-' + id);
    card.classList.add('btn-loading');
    try {
      await callScript({ action: 'approve', id });
      guests = guests.map(g => g.id == id ? { ...g, status: 'aprobado' } : g);
    } catch (e) { alert('Error al aprobar. Intentá de nuevo.'); }
    render();
  }

  async function reject(id) {
    if (!confirm('¿Rechazar este pago?')) return;
    try {
      await callScript({ action: 'reject', id });
      guests = guests.map(g => g.id == id ? { ...g, status: 'rechazado' } : g);
    } catch (e) { alert('Error al rechazar. Intentá de nuevo.'); }
    render();
  }

  function showQR(id) {
    const g = guests.find(x => x.id == id);
    document.getElementById('modalName').textContent = g.name;
    document.getElementById('modalDni').textContent = 'DNI ' + g.dni;
    document.getElementById('qrModal').classList.add('open');
    const container = document.getElementById('qrCanvas');
    container.innerHTML = '';
    const qrData = JSON.stringify({ id: g.id, nombre: g.name, dni: g.dni, event: 'BLP-20250411' });
    new QRCode(container, {
      text: qrData, width: 200, height: 200,
      colorDark: '#0a0a0a', colorLight: '#f0ece0',
      correctLevel: QRCode.CorrectLevel.H
    });
  }

  function closeModal() {
    document.getElementById('qrModal').classList.remove('open');
  }

  function setFilter(f, btn) {
    currentFilter = f;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function statusLabel(s) {
    if (s === 'pendiente') return 'Pendiente';
    if (s === 'aprobado') return 'Aprobado';
    return 'Rechazado';
  }

  function render() {
    const filtered = currentFilter === 'all' ? guests : guests.filter(g => g.status === currentFilter);
    const pending = guests.filter(g => g.status === 'pendiente').length;
    const approved = guests.filter(g => g.status === 'aprobado').length;
    document.getElementById('statPending').textContent = pending;
    document.getElementById('statApproved').textContent = approved;
    document.getElementById('statTotal').textContent = guests.length;
    document.getElementById('pendingBadge').textContent = pending + ' pendiente' + (pending !== 1 ? 's' : '');

    const list = document.getElementById('guestList');
    if (filtered.length === 0) {
      list.innerHTML = '<div class="empty-state">No hay registros en esta categoría.</div>';
      return;
    }

    list.innerHTML = filtered.map(g => `
      <div class="guest-card" id="card-${g.id}">
        <div class="guest-top">
          <div>
            <div class="guest-name">${g.name}</div>
            <div class="guest-meta">DNI ${g.dni}</div>
          </div>
          <span class="status-badge status-${g.status}">${statusLabel(g.status)}</span>
        </div>
        <div class="guest-email">${g.email}</div>
        <div class="guest-tanda">${g.tanda || ''} · $${Number(g.precio || 0).toLocaleString('es-AR')}</div>
        <div class="guest-actions">
          ${g.status === 'pendiente' ? `
            <button class="btn-approve" onclick="approve('${g.id}')">✓ Aprobar pago</button>
            <button class="btn-reject" onclick="reject('${g.id}')">✕ Rechazar</button>
          ` : g.status === 'aprobado' ? `
            <button class="btn-qr" onclick="showQR('${g.id}')">Ver QR</button>
            <span style="font-size:11px;color:#5DCAA5;align-self:center;margin-left:4px;">${g.qrSent === 'si' ? '✓ Email enviado' : ''}</span>
          ` : `<span style="font-size:12px;color:#555;">Pago rechazado</span>`}
        </div>
      </div>
    `).join('');
  }
</script>
</body>
</html>
